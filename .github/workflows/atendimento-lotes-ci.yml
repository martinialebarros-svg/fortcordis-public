name: Atendimento Lotes CI

on:
  pull_request:
    branches: [stage, main]

permissions:
  contents: read

jobs:
  atendimento-lotes-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lote_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Verify source recovery, clinical review and PostgreSQL fencing
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: atendimento-lotes-ci-synthetic-secret-1234567890
          FORTCORDIS_PROCESS_ROLE: api
          OPENAI_API_KEY: ""
          LOTE_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/lote_test
        run: |
          python -m pytest -q \
            backend/tests/test_atendimento_assistente_lote_provider.py \
            backend/tests/test_atendimento_assistente_lotes.py \
            backend/tests/test_atendimento_assistente_lotes_postgres.py \
            backend/tests/test_atendimento_assistente_raca_provider.py \
            backend/tests/test_atendimento_revisao_raca.py \
            backend/tests/test_atendimento_revisao_raca_postgres.py \
            backend/tests/test_background_worker_isolation.py
